<meta charset="utf-8" /><title>地球自转与昼夜</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    background: #102331;
    color: #eaf3f4;
    font:
      14px system-ui,
      sans-serif;
  }
  canvas {
    width: 100%;
    height: 100%;
    min-height: 0;
    touch-action: none;
    cursor: grab;
  }
  canvas:active {
    cursor: grabbing;
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    background: #193243;
    padding: 6px 12px;
  }
  button {
    background: #254958;
    color: #edf4ef;
    border: 1px solid #557480;
    border-radius: 5px;
    padding: 4px 9px;
  }
  input {
    accent-color: #7cd7c2;
  }
  output {
    font-variant-numeric: tabular-nums;
  }
</style>
<canvas id="globe" aria-label="可旋转的三维经纬球，拖动改变观察角度"></canvas>
<div class="controls">
  <button id="spin">自转</button><button id="home">复位</button
  ><label><input id="axis" type="checkbox" />地轴</label
  ><label><input id="light" type="checkbox" />昼夜</label
  ><output id="longitude"></output>
</div>
<script>
  (() => {
    const get = (id) => document.getElementById(id),
      canvas = get("globe"),
      ctx = canvas.getContext("2d"),
      cfg = window.studioParams || {};
    const rad = Math.PI / 180,
      tau = Math.PI * 2;
    let lon,
      lat,
      rotation = 0,
      frame = 0,
      last = 0,
      drag = null;
    // Public-domain Natural Earth 1:110m land, rendered as an equirectangular binary mask.
    const texture = new Image(),
      globe = document.createElement("canvas"),
      gc = globe.getContext("2d");
    const side = 288,
      cache = new Map();
    globe.width = globe.height = side;
    let land;
    texture.onload = () => {
      const c = document.createElement("canvas");
      c.width = 720;
      c.height = 360;
      const t = c.getContext("2d");
      t.drawImage(texture, 0, 0);
      land = t.getImageData(0, 0, 720, 360).data;
      draw();

    function paintSphere(r, cx, cy) {
      if (!land) return;
      // Cache inverse-projected sample coordinates while the viewing latitude stays fixed.
      if (!cache.has(lat)) {
        cache.clear();
        const lut = [];
        for (let y = 0; y < side; y++)
          for (let x = 0; x < side; x++) {
            const nx = ((x + 0.5) * 2) / side - 1,
              ny = 1 - ((y + 0.5) * 2) / side,
              nz2 = 1 - nx * nx - ny * ny;
            if (nz2 < 0) continue;
            const nz = Math.sqrt(nz2),
              worldY = ny * Math.cos(lat) + nz * Math.sin(lat),
              worldZ = nz * Math.cos(lat) - ny * Math.sin(lat);
            lut.push([
              4 * (y * side + x),
              (Math.atan2(nx, worldZ) / rad) * 2 + 360,
              Math.min(
                359,
                Math.max(0, Math.floor(180 - (Math.asin(worldY) / rad) * 2)),
              ) * 720,
              nx,
              nz,
            ]);
          }
        cache.set(lat, lut);
      }
      const pixels = gc.createImageData(side, side),
        shift = ((lon + rotation) / rad) * 2,
        lit = get("light").checked;
      for (const [i, u, v, nx, nz] of cache.get(lat)) {
        const col = ((Math.floor(u - shift) % 720) + 720) % 720;
        const isLand = land[4 * (v + col)] > 127;
        const brightness = lit
          ? 0.35 + 0.65 * Math.max(0, Math.min(1, 0.55 - 3 * nx))
          : 1;
        const shade = (0.81 + 0.19 * nz) * brightness;
        pixels.data[i] = (isLand ? 140 : 56) * shade;
        pixels.data[i + 1] = (isLand ? 184 : 126) * shade;
        pixels.data[i + 2] = (isLand ? 145 : 154) * shade;
        pixels.data[i + 3] = 255;
      }
      gc.putImageData(pixels, 0, 0);
      ctx.drawImage(globe, cx - r, cy - r, 2 * r, 2 * r);
    }
    function draw() {
      const w = canvas.width,
        h = canvas.height;
      if (!w || !h) return;
      ctx.clearRect(0, 0, w, h);
      const r = Math.min(w * 0.37, h * 0.405),
        cx = w / 2,
        cy = h / 2;
      // Rotate points in 3D, cull the far hemisphere, then project to the screen.
      function project(phi, theta) {
        const a = theta + lon + rotation,
          x = Math.cos(phi) * Math.sin(a),
          b = Math.sin(phi),
          c = Math.cos(phi) * Math.cos(a);
        return [
          cx + r * x,
          cy - r * (b * Math.cos(lat) - c * Math.sin(lat)),
          c * Math.cos(lat) + b * Math.sin(lat),
        ];
      }
      function line(points, color, width = 1) {
        ctx.beginPath();
        let visible = false;
        for (const [x, y, z] of points) {
          if (z >= 0) {
            if (visible) ctx.lineTo(x, y);
            else ctx.moveTo(x, y);
          }
          visible = z >= 0;
        }
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
      }
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, tau);
      ctx.clip();
      ctx.fillStyle = "#387e9a";
      ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
      // Orthographic terminator for sunlight arriving from screen-left.
      if (get("light").checked) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI / 2, Math.PI / 2);
        ctx.closePath();
        ctx.fillStyle = "#173345";
        ctx.fill();
      }
      paintSphere(r, cx, cy);
      for (let a = -75; a <= 75; a += 15)
        line(
          Array.from({ length: 181 }, (_, i) =>
            project(a * rad, (i * tau) / 180),
          ),
          a === 0 ? "#ffcf83" : "#8dbabd",
          a === 0 ? 2 : 1,
        );
      for (let b = 0; b < 360; b += 15)
        line(
          Array.from({ length: 91 }, (_, i) =>
            project((i * 2 - 90) * rad, b * rad),
          ),
          b === 0 ? "#efba80" : "#78aeb4",
          b === 0 ? 2 : 1,
        );
      const point = project(0, 0);
      if (point[2] >= 0) {
        ctx.beginPath();
        ctx.arc(point[0], point[1], 4, 0, tau);
        ctx.fillStyle = "#ffcb7a";
        ctx.fill();
      }
      ctx.restore();
      if (get("axis").checked) {
        ctx.strokeStyle = "#ecd098";
        ctx.setLineDash([5, 4]);
        ctx.beginPath();
        ctx.moveTo(cx, cy - r * 1.15 * Math.cos(lat));
        ctx.lineTo(cx, cy + r * 1.15 * Math.cos(lat));
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#ffe2a3";
        ctx.font = "14px system-ui";
        ctx.fillText("N", cx + 6, Math.max(15, cy - r * 1.15 * Math.cos(lat)));
      }
      get("longitude").textContent =
        "旋转 " + ((((rotation / rad) % 360) + 360) % 360).toFixed(0) + "°";
    }
    function pause() {
      cancelAnimationFrame(frame);
      frame = 0;
      get("spin").textContent = "自转";
    }
    function tick(t) {
      rotation += (t - last) * 0.00045;
      last = t;
      draw();
      frame = requestAnimationFrame(tick);
    }
    function play() {
      if (frame) return;
      last = performance.now();
      frame = requestAnimationFrame(tick);
      get("spin").textContent = "暂停";
    }
    function reset() {
      pause();
      lon = Number(cfg.longitude ?? 30) * rad;
      lat = Number(cfg.latitude ?? 23.5) * rad;
      rotation = 0;
      get("axis").checked = cfg.axis !== false;
      get("light").checked = cfg.daylight !== false;
      draw();
    }
    new ResizeObserver(() => {
      canvas.width = Math.max(
        1,
        Math.round(canvas.clientWidth * devicePixelRatio),
      );
      canvas.height = Math.max(
        1,
        Math.round(canvas.clientHeight * devicePixelRatio),
      );
      draw();
    }).observe(canvas);
    canvas.onpointerdown = (e) => {
      drag = [e.clientX, e.clientY];
      canvas.setPointerCapture(e.pointerId);
    };
    canvas.onpointermove = (e) => {
      if (!drag) return;
      lon += (e.clientX - drag[0]) * 0.009;
      lat = Math.max(
        -1.45,
        Math.min(1.45, lat + (e.clientY - drag[1]) * 0.009),
      );
      drag = [e.clientX, e.clientY];
      draw();
    };
    canvas.onlostpointercapture = () => (drag = null);
    get("spin").onclick = () => (frame ? pause() : play());
    get("home").onclick = reset;
    get("axis").onchange = get("light").onchange = draw;
    addEventListener("message", (e) => {
      if (e.source === parent && e.data?.type === "studio-action")
        ({ play, pause, reset })[e.data.action]?.();
    });
    reset();
  })();
</script>
